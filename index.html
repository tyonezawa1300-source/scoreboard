<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="スコアボード">
  <title>スコアボード</title>
  <script>
    (function(){
      var v = '20260524-1';
      if (location.search !== '?v=' + v) {
        location.replace(location.pathname + '?v=' + v);
      }
    })();
  </script>
  <style>
    :root {
      --cell: 46px;
      --gap: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.12);
      text-align: center;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
    }

    #groups {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .group {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .group-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
    }

    /* ── Pyramid ── */
    .pyramid {
      position: relative;
      width: 100%;
    }

    .tcell {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
      border: 2px solid #111;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .tcell::after {
      content: '';
      width: calc(var(--cell) - 16px);
      height: calc(var(--cell) - 16px);
      border-radius: 50%;
      background: transparent;
      transition: background 0.12s;
    }

    .tcell.on::after {
      background: #111;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 16px 0;
    }

    /* ── Number inputs ── */
    .num-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .num-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .num-label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      min-width: 90px;
    }

    .num-input {
      flex: 0 0 auto;
      width: 176px;
      height: 34px;
      border: 2px solid #111;
      border-radius: 8px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      background: #f9f9f9;
      color: #111;
      pointer-events: none;
    }

    /* ── Slider ── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: -2px;
      margin-bottom: 4px;
    }

    .slider-label {
      font-size: 11px;
      color: #999;
      min-width: 16px;
      text-align: center;
    }

    .slider {
      flex: 1;
      height: 4px;
      accent-color: #007aff;
      transform: scaleX(-1);
      cursor: pointer;
    }

    /* ── Text input ── */
    .text-input {
      width: 100%;
      min-height: 31px;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: #111;
      resize: vertical;
      margin-top: 8px;
    }

    /* ── Buttons ── */
    .btn-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      background: rgba(242,242,247,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      gap: 8px;
    }

    .next-btn, .save-btn, .clear-btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      color: #fff;
    }

    .next-btn  { background: #007aff; }
    .next-btn:active  { background: #005ecb; }
    .save-btn  { background: #34c759; }
    .save-btn:active  { background: #248a3d; }
    .clear-btn { background: #ff3b30; }
    .clear-btn:active { background: #c0392b; }

    /* ── 印刷用スタイル ── */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      header {
        position: static;
        background: #fff;
        border-bottom: 1px solid #ccc;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .btn-wrap { display: none; }
      #groups { padding: 8px; gap: 16px; }
      .group {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .tcell {
        border: 2px solid #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .tcell.on::after {
        background: #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .num-input {
        border: 2px solid #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<header>スコアボード</header>
<div id="groups"></div>

<div class="btn-wrap">
  <button class="next-btn" onclick="addGroup()">次へ</button>
  <button class="save-btn" onclick="saveAsPDF()">保存</button>
  <button class="clear-btn" onclick="clearAll()">クリア</button>
</div>

<script>
  const CELL  = 46;   // px (must match --cell CSS var)
  const VGAP  = 24;   // vertical gap between rows

  // x-centers for each row relative to container width W
  function calcCenters(W) {
    const L    = CELL / 2;
    const R    = W - CELL / 2;
    const step = (R - L) / 3;
    return [
      [0,1,2,3].map(i => L + i * step),          // 4 cells
      [0,1,2].map(i => L + (i + 0.5) * step),    // 3 cells
      [0,1].map(i => L + (i + 1) * step),         // 2 cells
      [L + 1.5 * step]                             // 1 cell
    ];
  }

  function buildPyramid(container) {
    const rowCounts = [4, 3, 2, 1];
    const totalH    = rowCounts.length * (CELL + VGAP) - VGAP;
    container.style.height = totalH + 'px';

    function placeCell() {
      const W = container.offsetWidth;
      if (W === 0) { requestAnimationFrame(placeCell); return; }
      const centers = calcCenters(W);
      rowCounts.forEach((count, row) => {
        const yTop = row * (CELL + VGAP);
        for (let i = 0; i < count; i++) {
          const cell = document.createElement('div');
          cell.className = 'tcell';
          cell.style.left = (centers[row][i] - CELL / 2) + 'px';
          cell.style.top  = yTop + 'px';
          cell.addEventListener('click', () => cell.classList.toggle('on'));
          container.appendChild(cell);
        }
      });
    }
    requestAnimationFrame(() => requestAnimationFrame(placeCell));
  }

  let count = 0;

  function addGroup() {
    count++;
    const wrap = document.getElementById('groups');

    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = `
      <div class="group-label">グループ ${count}</div>
      <div class="pyramid" data-pyramid></div>
      <div class="divider"></div>
      <div class="num-inputs">
        <div class="num-row">
          <span class="num-label">スパッツの位置</span>
          <input class="num-input" type="text" readonly value="20">
        </div>
        <div class="slider-row">
          <span class="slider-label">50</span>
          <input type="range" class="slider" min="0" max="50" value="20">
          <span class="slider-label">0</span>
        </div>
        <div class="num-row">
          <span class="num-label">ファールL位置</span>
          <input class="num-input" type="text" readonly value="40">
        </div>
        <div class="slider-row">
          <span class="slider-label">50</span>
          <input type="range" class="slider" min="0" max="50" value="40">
          <span class="slider-label">0</span>
        </div>
        <textarea class="text-input" placeholder="メモを入力..."></textarea>
      </div>`;

    wrap.appendChild(group);
    buildPyramid(group.querySelector('[data-pyramid]'));

    // スライダーと数値入力を連動
    const sliders   = group.querySelectorAll('.slider');
    const numInputs = group.querySelectorAll('.num-input');
    sliders.forEach((slider, i) => {
      slider.addEventListener('input', () => {
        numInputs[i].value = slider.value;
      });
    });

    setTimeout(() => group.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }

  function clearAll() {
    if (!confirm('すべての入力をクリアしますか？')) return;
    document.getElementById('groups').innerHTML = '';
    count = 0;
    addGroup();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function saveAsPDF() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.title = `${y}-${m}-${d}-ボウリング`;
    window.print();
  }

  addGroup(); // initial group
</script>
</body>
</html>
