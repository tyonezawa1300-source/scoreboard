<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="スコアボード">
  <title>スコアボード</title>
  <style>
    :root {
      --cell: 46px;
      --gap: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.12);
      text-align: center;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
    }

    #groups {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .group {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .group-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
    }

    /* ── Pyramid ── */
    .pyramid {
      position: relative;
      width: 100%;
    }

    .tcell {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
      border: 2px solid #111;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .tcell::after {
      content: '';
      width: calc(var(--cell) - 16px);
      height: calc(var(--cell) - 16px);
      border-radius: 50%;
      background: transparent;
      transition: background 0.12s;
    }

    .tcell.on::after {
      background: #111;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 16px 0;
    }

    /* ── Number inputs ── */
    .num-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .num-input {
      width: 100%;
      height: 52px;
      border: 2px solid #111;
      border-radius: 8px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: #111;
      -moz-appearance: textfield;
    }

    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Next button ── */
    .btn-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: rgba(242,242,247,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    .next-btn {
      width: 100%;
      height: 52px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .next-btn:active { background: #005ecb; }

    .save-btn {
      width: 100%;
      height: 52px;
      background: #34c759;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      margin-bottom: 8px;
    }

    .save-btn:active { background: #248a3d; }

    /* ── 印刷用スタイル ── */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      header {
        position: static;
        background: #fff;
        border-bottom: 1px solid #ccc;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .btn-wrap { display: none; }
      #groups { padding: 8px; gap: 16px; }
      .group {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .tcell {
        border: 2px solid #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .tcell.on::after {
        background: #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .num-input {
        border: 2px solid #111 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<header>スコアボード</header>
<div id="groups"></div>

<div class="btn-wrap">
  <button class="save-btn" onclick="saveAsPDF()">保存</button>
  <button class="next-btn" onclick="addGroup()">次へ</button>
</div>

<script>
  const CELL  = 46;   // px (must match --cell CSS var)
  const VGAP  = 24;   // vertical gap between rows

  // x-centers for each row relative to container width W
  function calcCenters(W) {
    const L    = CELL / 2;
    const R    = W - CELL / 2;
    const step = (R - L) / 3;
    return [
      [0,1,2,3].map(i => L + i * step),          // 4 cells
      [0,1,2].map(i => L + (i + 0.5) * step),    // 3 cells
      [0,1].map(i => L + (i + 1) * step),         // 2 cells
      [L + 1.5 * step]                             // 1 cell
    ];
  }

  function buildPyramid(container) {
    const rowCounts = [4, 3, 2, 1];
    const totalH    = rowCounts.length * (CELL + VGAP) - VGAP;
    container.style.height = totalH + 'px';

    requestAnimationFrame(() => {
      const W       = container.offsetWidth;
      const centers = calcCenters(W);

      rowCounts.forEach((count, row) => {
        const yTop = row * (CELL + VGAP);
        for (let i = 0; i < count; i++) {
          const cell = document.createElement('div');
          cell.className = 'tcell';
          cell.style.left = (centers[row][i] - CELL / 2) + 'px';
          cell.style.top  = yTop + 'px';
          cell.addEventListener('click', () => cell.classList.toggle('on'));
          container.appendChild(cell);
        }
      });
    });
  }

  let count = 0;

  function addGroup() {
    count++;
    const wrap = document.getElementById('groups');

    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = `
      <div class="group-label">グループ ${count}</div>
      <div class="pyramid" data-pyramid></div>
      <div class="divider"></div>
      <div class="num-inputs">
        <input class="num-input" type="number" inputmode="numeric" placeholder="0">
        <input class="num-input" type="number" inputmode="numeric" placeholder="0">
      </div>`;

    wrap.appendChild(group);
    buildPyramid(group.querySelector('[data-pyramid]'));

    setTimeout(() => group.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }

  function saveAsPDF() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.title = `${y}${m}${d}-ボウリング`;
    window.print();
  }

  addGroup(); // initial group
</script>
</body>
</html>
